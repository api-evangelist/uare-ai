aid: uare-ai
name: Uare.ai
description: Uare.ai is a consumer Individual AI platform founded by LivePerson founder
  Rob LoCascio that lets people build and own a personal AI trained on their own voice,
  knowledge, and experiences, organized by its proprietary Human Life Model across seven
  dimensions (Identity, World, Story, Mindset, Drive, Pattern, Growth). The company raised
  a $10.3M seed led by Mayfield and Boldstart Ventures in November 2025. Memberships are
  metered in Credits and include MCP tool integrations that connect an Individual AI to
  1000+ applications, with iOS and Android apps alongside the web app at app.uare.ai.
  Uare.ai publishes no public developer API, API documentation, or SDKs as of July 2026.
